<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header">
    <header class="header">
        <nav class="nav">
            <a th:href="@{/}" class="nav-brand">
                <span>🚆</span>
                Ж/Д Мониторинг
            </a>

            <ul class="nav-menu">
                <li><a th:href="@{/}">Главная</a></li>
                <li><a th:href="@{/krasnoyarsk}">Участок 0-125 км</a></li>
                <li><a th:href="@{/east-siberia}">Участок 125-230 км</a></li>
                <li><a th:href="@{/zabalkalye}">Участок 230-335 км</a></li>

                <!-- Вкладка для ЦДУ - показывается только авторизованным пользователям ЦДУ -->
                <li th:if="${isAuthenticated and userDirectorate == 'ЦДУ'}">
                    <a th:href="@{/cdu/dashboard}" class="cdu-tab">Панель ЦДУ</a>
                </li>
            </ul>

            <div class="nav-auth">
                <span class="km-display">230-335 км</span>

                <!-- Для авторизованных пользователей -->
                <div th:if="${isAuthenticated}" class="user-profile-compact">
                    <div class="user-avatar-small" th:text="${#strings.substring(currentUsername, 0, 1).toUpperCase()}">
                        А
                    </div>
                    <span class="user-welcome" th:text="${currentUsername}">Антонов Александр</span>
                    <a th:href="@{/auth/logout}" class="logout-btn-compact">Выйти</a>
                </div>

                <!-- Для неавторизованных пользователей -->
                <div th:unless="${isAuthenticated}">
                    <a th:href="@{/auth/login}">Войти</a>
                    <a th:href="@{/auth/register}">Регистрация</a>
                </div>
            </div>
        </nav>
    </header>
</div>
</body>
</html>
